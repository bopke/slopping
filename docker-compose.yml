# Shardfall game server.
#   docker compose up -d --build                 -> plain ws on :8080 (put your own TLS proxy in front)
#   docker compose --profile tls up -d --build   -> also runs Caddy with automatic HTTPS for $DOMAIN
services:
  server:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - shardfall-data:/data
    ports:
      - "${SERVER_PORT:-8080}:8080"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  shardfall-data:
  caddy-data:
  caddy-config:
